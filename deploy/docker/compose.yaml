# Run with ONECTX_VERSION set to a release. ./secrets holds user-admin.key,
# the first admin's key and never a password, another admin's
# user-<username>.key and the <kind>-<name>.key files, each readable by
# 65532 (mode 600 owned by 65532). Make a key into a temp file, check it,
# and move it only where none is (never `>` over a key):
#   key=$(mktemp); docker run --rm <image> admin-key admin --stdout > "$key"
#   grep -q '^1ctx-admin-' "$key" && mv -n "$key" secrets/user-admin.key
# Members sign in by email. ./provision (or ONECTX_PROVISION) holds the
# YAML objects applied at every start.
name: 1ctx
services:
  1ctx:
    image: ghcr.io/stefanprodan/1ctx:${ONECTX_VERSION:?set ONECTX_VERSION to a 1ctx release}
    restart: unless-stopped
    # the drain (10 s by default) plus 15
    stop_grace_period: 25s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "11236:11236"
    volumes:
      - data:/data
      - ./secrets:/secrets:ro
      - ${ONECTX_PROVISION:-./provision}:/provision:ro
volumes:
  data:
