# Replace the storage class, the Gateway and the hostname with your own.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: onectx
  namespace: onectx
spec:
  interval: 1h
  url: oci://ghcr.io/stefanprodan/charts/onectx
  ref:
    semver: "0.x"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onectx
  namespace: onectx
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: onectx
  # the startup probe allows a migration ten minutes
  timeout: 15m
  values:
    secrets:
      existingSecret: onectx
    persistence:
      storageClass: standard
    httpRoute:
      enabled: true
      parentRefs:
        - name: public
          namespace: gateway
          sectionName: https
      hostnames:
        - 1ctx.example.com
