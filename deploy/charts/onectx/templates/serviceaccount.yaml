{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "onectx.serviceAccountName" . }}
  labels:
    {{- include "onectx.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# the server never calls the Kubernetes API
automountServiceAccountToken: false
{{- end }}
