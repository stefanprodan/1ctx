name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Bun version
        id: bun
        run: |
          version=$(scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Verify architecture
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint and type-check
        run: make lint
      - name: Check if working tree is dirty
        run: |
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'run make lint and commit changes'
            exit 1
          fi
      - name: Test
        run: make test ARGS=--parallel
      - name: Test vendored just-bash
        run: make vendor-test
      - name: Build
        run: make build
      - name: Smoke test binary
        run: |
          expected="v$(bun -e 'console.log(require("./package.json").version)')"
          test "$(./bin/1ctx --version)" = "$expected"
          ./bin/1ctx --help >/dev/null
          make smoke

  linux-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Bun version
        id: bun
        run: |
          version=$(scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Verify architecture
        run: test "$(uname -m)" = x86_64
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test
        run: make test ARGS=--parallel
      - name: Build
        run: make build
      - name: Smoke test binary
        run: |
          expected="v$(bun -e 'console.log(require("./package.json").version)')"
          test "$(./bin/1ctx --version)" = "$expected"
          ./bin/1ctx --help >/dev/null
          make smoke
      - name: Smoke test image
        run: |
          expected="v$(bun -e 'console.log(require("./package.json").version)')"
          make image-smoke VERSION="$expected"
