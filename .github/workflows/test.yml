name: test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Bun version
        id: bun
        run: |
          version=$(scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Verify architecture
        run: test "$(uname -m)" = x86_64
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint and type-check
        run: make lint
      - name: Check if working tree is dirty
        run: |
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'run make lint and commit changes'
            exit 1
          fi
      - name: Test
        run: make test ARGS=--parallel
      - name: Build
        run: make build
      - name: Smoke test binary
        run: |
          expected="v$(bun -e 'console.log(require("./package.json").version)')"
          test "$(./bin/1ctx --version)" = "$expected"
          ./bin/1ctx --help >/dev/null
          make smoke
      # flux-schema renders charts with Helm 4
      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.0
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: 2.9.6
          plugins: |
            schema@0.16.0
      - parallel:
          - name: Smoke test image
            run: |
              expected="v$(bun -e 'console.log(require("./package.json").version)')"
              make image-smoke VERSION="$expected"
          - name: Check Docker Compose files
            env:
              ONECTX_VERSION: dev
            run: |
              docker compose -f deploy/docker/compose.yaml config --quiet
              docker compose -f deploy/docker/compose.yaml \
                -f deploy/docker/compose.dev.yaml config --quiet
          - name: Lint Helm chart
            run: helm lint --strict deploy/charts/onectx
          - name: Validate Kubernetes manifests
            uses: fluxcd/flux-schema/actions/validate@4c71b2098ba84b738d811877463f5a2b2bfe443f # v0.17.0
            with:
              path: deploy
              exclude: |
                deploy/docker
              helm-charts: "true"

  vendor-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Bun version
        id: bun
        run: |
          version=$(scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test vendored just-bash
        run: make vendor-test ARGS=--parallel

  # the sandbox image's variants, when a change touches them: both
  # platforms with no QEMU, so a RUN on the target platform fails the
  # arm64 build, then each native variant's offline contract. Otherwise
  # it passes without building, so the check always reports.
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # fetch the repository and its history to diff
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # a pull request's merge commit and its base parent; a
          # dispatched branch needs main's history for the merge base
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - name: Find sandbox image changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            workflow_dispatch) base=$(git merge-base origin/main HEAD) ;;
            *)
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          build=false
          git diff --quiet "$base" HEAD -- deploy/sandbox \
            scripts/sandbox-image.sh scripts/sandbox-image-check.ts || build=true
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Read Bun version
        if: steps.changes.outputs.build == 'true'
        id: bun
        run: |
          version=$(scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        if: steps.changes.outputs.build == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Install dependencies
        if: steps.changes.outputs.build == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Setup Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build every platform
        if: steps.changes.outputs.build == 'true'
        run: make sandbox-image PLATFORMS=linux/amd64,linux/arm64
      - name: Build the native variants
        if: steps.changes.outputs.build == 'true'
        run: make sandbox-image
      - name: Check the variants
        if: steps.changes.outputs.build == 'true'
        run: |
          for variant in python bun go rust; do
            bun scripts/sandbox-image-check.ts --docker --variant "$variant"
          done

  macos-smoke:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Bun version
        id: bun
        run: |
          version=$(scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Verify architecture
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build
        run: make build
      - name: Smoke test binary
        run: |
          expected="v$(bun -e 'console.log(require("./package.json").version)')"
          test "$(./bin/1ctx --version)" = "$expected"
          ./bin/1ctx --help >/dev/null
          make smoke
