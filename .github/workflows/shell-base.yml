name: shell-base

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
      # a workflow off main cannot be dispatched, so this branch
      # publishes the first base; it is named in every publish rule below
      - build/shell-base-image
    paths:
      - deploy/sandbox/base/**
      - .github/workflows/shell-base.yml
  pull_request:
    paths:
      - deploy/sandbox/base/**
      - .github/workflows/shell-base.yml

permissions:
  contents: read

# Only main publishes: push, attest and smoke. Any other ref, a pull
# request or a dispatch included, builds both targets and stops. One
# publish at a time moves the tags.
concurrency:
  group: shell-base-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/shell-base-image') && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  # each platform builds on its own native runner, joined into one index
  # under the moving and the dated tag
  base:
    uses: docker/github-builder/.github/workflows/build.yml@bb1eb9fb69408ac52395fb21f49c6b52d564529a # v1.20.0
    permissions:
      contents: read # fetch the repository as the build context
      packages: write # push the base image to GHCR
      id-token: write # mint the OIDC token cosign signs the provenance with
    with:
      output: image
      push: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/shell-base-image') }}
      context: deploy/sandbox/base
      target: base
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository_owner }}/1ctx-shell-base
      meta-tags: |
        type=raw,value=trixie
        type=raw,value=trixie-{{date 'YYYYMMDD'}}
      meta-flavor: latest=false
      set-meta-labels: true
      set-meta-annotations: true
      meta-labels: |
        org.opencontainers.image.description=The base of the 1ctx sandbox shell images.
      meta-annotations: |
        org.opencontainers.image.description=The base of the 1ctx sandbox shell images.
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  cc:
    uses: docker/github-builder/.github/workflows/build.yml@bb1eb9fb69408ac52395fb21f49c6b52d564529a # v1.20.0
    permissions:
      contents: read # fetch the repository as the build context
      packages: write # push the base image to GHCR
      id-token: write # mint the OIDC token cosign signs the provenance with
    with:
      output: image
      push: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/shell-base-image') }}
      context: deploy/sandbox/base
      target: cc
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository_owner }}/1ctx-shell-base
      meta-tags: |
        type=raw,value=trixie-cc
        type=raw,value=trixie-cc-{{date 'YYYYMMDD'}}
      meta-flavor: latest=false
      set-meta-labels: true
      set-meta-annotations: true
      meta-labels: |
        org.opencontainers.image.description=The base of the 1ctx sandbox shell images, with gcc.
      meta-annotations: |
        org.opencontainers.image.description=The base of the 1ctx sandbox shell images, with gcc.
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  attest:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/shell-base-image')
    needs: [base, cc]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the attestations to GHCR
      id-token: write # mint the OIDC token that signs the attestations
      attestations: write # write the build provenance attestations
      artifact-metadata: write # create the artifact storage records
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attest base provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/1ctx-shell-base
          subject-digest: ${{ needs.base.outputs.digest }}
          push-to-registry: true
      - name: Attest cc provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/1ctx-shell-base
          subject-digest: ${{ needs.cc.outputs.digest }}
          push-to-registry: true

  # the builder has no step before its push, so the contract runs on
  # the pushed digests, on the builder's own runners
  smoke:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/shell-base-image')
    needs: [base, cc]
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read # pull the base image, private until made public
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/1ctx-shell-base
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Bun version
        id: bun
        run: |
          version=$(scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check base
        env:
          DIGEST: ${{ needs.base.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          bun scripts/sandbox-image-check.ts --docker --variant python --image "$IMAGE@$DIGEST"
      - name: Check cc
        env:
          DIGEST: ${{ needs.cc.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          bun scripts/sandbox-image-check.ts --docker --variant cc --image "$IMAGE@$DIGEST"

  # moves the git and ripgrep pins through one pull request, on main
  # only, so the bump's own branch never bumps again
  tools:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump's branch
      pull-requests: write # open or update its pull request
      actions: write # dispatch test.yml and this workflow, which a github.token PR never starts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Bun version
        id: bun
        run: |
          version=$(scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Bump the pins
        run: make sandbox-tools
      - name: Summarize the changes
        run: bun scripts/sandbox-tools.ts --diff > "$RUNNER_TEMP/tools-diff.md"
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          sign-commits: true
          branch: shell-tools
          commit-message: 'build(sandbox): bump git and ripgrep in the shell base'
          title: 'build(sandbox): bump git and ripgrep in the shell base'
          body-path: ${{ runner.temp }}/tools-diff.md
          labels: build
          add-paths: deploy/sandbox/base/Dockerfile
      # the dispatched shell-base run only builds, off main
      - name: Run CI on the bump
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref shell-tools
          gh workflow run shell-base.yml --repo "$GITHUB_REPOSITORY" --ref shell-tools
