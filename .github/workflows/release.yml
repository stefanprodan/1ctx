name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the archives
      packages: write # push the image and the Helm chart to GHCR
      id-token: write # mint the OIDC token that signs the attestations
      attestations: write # write the build provenance attestations
      artifact-metadata: write # create the artifact storage records
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi
      - name: Derive version
        id: version
        run: |
          # the tag is the image tag and the chart version: semver, no build metadata
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          prerelease=false
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=true
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Read Bun version
        id: bun
        run: |
          version=$(scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Verify architecture
        run: test "$(uname -m)" = x86_64
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and smoke test linux amd64
        run: |
          make build VERSION="$GITHUB_REF_NAME"
          test "$(./bin/1ctx --version)" = "$GITHUB_REF_NAME"
          ./bin/1ctx --help >/dev/null
          make smoke
          scripts/archive.sh linux_amd64
      # Bun cross-compiles the rest; a darwin build is ad-hoc signed and runs
      - name: Build linux arm64
        run: |
          make build VERSION="$GITHUB_REF_NAME" TARGET=bun-linux-arm64
          file bin/1ctx | grep -q 'ARM aarch64'
          scripts/archive.sh linux_arm64
      - name: Build darwin arm64
        run: |
          make build VERSION="$GITHUB_REF_NAME" TARGET=bun-darwin-arm64
          file bin/1ctx | grep -q 'Mach-O 64-bit.*arm64'
          scripts/archive.sh darwin_arm64
      - name: Smoke test image
        run: make image-smoke VERSION="$GITHUB_REF_NAME"
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # GHCR reads the description and source from the index
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=tag
          flavor: latest=false
          labels: |
            org.opencontainers.image.description=One continuous context for agents.
          annotations: |
            org.opencontainers.image.description=One continuous context for agents.
      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Package and push Helm chart
        id: chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helm package deploy/charts/1ctx --destination dist-chart \
            --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME"
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          helm push dist-chart/1ctx-"${GITHUB_REF_NAME#v}".tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1 | tee push.log
          # helm push prints the manifest digest as "Digest: sha256:..."
          digest=$(sed -n 's/^Digest: \(sha256:[a-f0-9]\{64\}\)$/\1/p' push.log)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest Helm chart provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/1ctx
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum 1ctx_*.tar.gz > 1ctx_checksums.txt
          cat 1ctx_checksums.txt
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/1ctx_checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
